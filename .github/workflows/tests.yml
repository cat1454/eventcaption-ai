name: CPU tests and wheel
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test,inference]" build
      - run: python -m pytest --cov=eventcaption_ai --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - run: python -m build --wheel
      - run: python tests/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-${{ matrix.os }}
          path: |
            coverage.xml
            junit.xml
            dist/*.whl
